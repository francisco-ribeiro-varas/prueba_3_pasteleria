<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto no disponible | Pastelería Dulce Hogar</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            place-items: center;
            background: #fffaf3;
            color: #392b2c;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }
        main { max-width: 540px; }
        .icon { font-size: 4rem; }
        h1 { margin: 0.5rem 0; font-size: clamp(2rem, 7vw, 3.2rem); }
        p { color: #715e5c; font: 1.05rem/1.7 Arial, sans-serif; }
        a {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.9rem 1.35rem;
            border-radius: 999px;
            background: #c65e68;
            color: white;
            font: bold 1rem Arial, sans-serif;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">🍰</div>
        <p>¡Ups! Algo se nos escapó del mostrador.</p>
        <h1>Producto no disponible</h1>
        <p>El producto que buscas no está disponible o ya no existe. Puedes volver al inicio para descubrir otras delicias.</p>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
